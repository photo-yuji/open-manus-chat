<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open Manus</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1&display=swap');

    body {
      margin: 0;
      background-color: #1a1a1a;
      color: #f0e6d2;
      font-family: 'Shippori Mincho B1', serif;
    }

    .container {
      max-width: 640px;
      margin: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #252220;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      letter-spacing: 2px;
      color: #f3deb4;
      border-bottom: 1px solid #635c4f;
      margin-bottom: 16px;
    }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      border: 1px solid #3a332a;
      background-color: #2c2b29;
      border-radius: 6px;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    #chat-form {
      display: flex;
      gap: 12px;
    }

    #user_input {
      flex: 1;
      padding: 12px;
      font-size: 1rem;
      background: #3b372f;
      color: #f7f0e1;
      border: 1px solid #5a4e3c;
      border-radius: 4px;
    }

    button {
      padding: 12px 24px;
      font-size: 1rem;
      background: #b29764;
      color: #1a1a1a;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #d1b980;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Open Manus</h1>
	<div id="chat-box">
	  {% if user_input %}
		<div><strong>あなた:</strong> {{ user_input }}</div>
		<div><strong>Open Manus:</strong> {{ response }}</div>
	  {% else %}
		<div>ここにメッセージが表示されます。</div>
	  {% endif %}
	</div>
    <form id="chat-form" method="POST">
      <input type="text" name="user_input" id="user_input" placeholder="メッセージを入力…" required />
      <button type="submit">送信</button>
    </form>
  </div>
</body>
</html>
